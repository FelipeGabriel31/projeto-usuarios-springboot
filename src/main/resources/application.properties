# Banco de dados H2 em memoria (dados de exemplo recriados em cada inicializacao)
spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas no inicio e remove ao encerrar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Desativado na hospedagem publica por seguranca.
spring.h2.console.enabled=false

# Funciona no Eclipse e tambem nas plataformas de hospedagem como Render.
# Em hospedagem, PORT sera fornecida pela plataforma.
server.address=0.0.0.0
server.port=${PORT:8080}
